name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python version comes from .python-version — setup-uv has no
      # python-version input of its own (that "version" input pins uv itself).
      - uses: astral-sh/setup-uv@v3

      - run: uv sync --locked

      # The autofill/entry tests drive a real headless Chromium against
      # local HTML fixtures — no live network — so CI needs the actual
      # browser binary, not just the playwright pip package.
      - run: uv run playwright install --with-deps chromium

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
