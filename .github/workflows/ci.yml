name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python version comes from .python-version — setup-uv has no
      # python-version input of its own (that "version" input pins uv itself).
      - uses: astral-sh/setup-uv@v3

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
