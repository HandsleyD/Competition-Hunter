name: Discover

# Discovery + triage trust zone (docs/implementation-plan.md): public
# competition data only. Never checkout or use profile.toml here — the entry
# layer stays on the user's own machine.
on:
  schedule:
    - cron: "0 */6 * * *" # ~4x/day
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python version comes from .python-version — setup-uv has no
      # python-version input of its own (that "version" input pins uv itself).
      - uses: astral-sh/setup-uv@v3

      # The SQLite DB persists across runs via cache rather than being
      # committed to the repo (design-options.md §4). Always re-save under a
      # fresh key so a partial/failed run never clobbers accumulated data.
      #
      # Prefix bumped to v2 to force a one-time fresh rebuild: a dedupe gap
      # (ThePrizeFinder's "-0"/"-1" slug-collision suffixes weren't
      # canonicalized away) let duplicate rows into every cached DB up to
      # this point. The fix means it won't happen again, but doesn't
      # retroactively merge rows that already exist under two different
      # ids — cheaper to just re-ingest from the live feeds than migrate.
      - name: Restore competitions database
        uses: actions/cache/restore@v4
        with:
          path: competitions.db
          key: competitions-db-v2-${{ github.run_id }}
          restore-keys: |
            competitions-db-v2-

      - run: uv sync --locked

      # GEMINI_API_KEY is just an API credential, not personal data — it's
      # fine in this trust zone. If it's unset, the run still completes and
      # simply leaves new competitions unenriched (competition_hunter/cli.py).
      - run: uv run competition-hunter --db competitions.db --out dashboard/out
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save competitions database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: competitions.db
          key: competitions-db-v2-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
