<!doctype html>
<html>
<head><title>Win a Prize</title></head>
<body>
  <form id="entry-form">
    <input id="email" type="email" />
    <label>
      <input id="marketing" type="checkbox" required />
      I agree to receive marketing emails (required to enter)
    </label>
    <label>
      <input id="terms" type="checkbox" />
      I accept the terms and conditions
    </label>
    <button id="submit-button" type="submit">Enter</button>
  </form>
</body>
</html>
