[project]
name = "competition-hunter"
version = "0.1.0"
description = "Competition entry automation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "google-genai>=1.0",
    "playwright>=1.62.0",
]

[project.scripts]
competition-hunter = "competition_hunter.cli:main"
competition-hunter-entry = "competition_hunter.entry.run:main"
competition-hunter-wins = "competition_hunter.wins.run:main"
competition-hunter-discover-local = "competition_hunter.discover_local:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
